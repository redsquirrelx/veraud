[project]
name = "agent-server"
version = "0.0.0"
description = "server for ai agents"
readme = "README.md"
authors = [
    { name = "redsquirrelx", email = "redsquirrel.xi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.23",
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.27.0",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "langsmith>=0.14.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
dev = "server.cli:dev"
project-orientation = "server.run_project_orientation:main"
project-architecture = "server.run_project_architecture:main"
project-semantic-validation = "server.run_project_semantic_validation:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server", "config"]
exclude = ["config/dev-agents.yaml", "config/dev-agents.yaml.template"]

[tool.hatch.build.targets.sdist]
include = ["src/server", "config", "pyproject.toml", "README.md"]
exclude = ["config/dev-agents.yaml", "config/dev-agents.yaml.template"]

[dependency-groups]
dev = [
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
