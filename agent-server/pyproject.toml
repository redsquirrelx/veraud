[project]
name = "agent-server"
version = "0.0.0"
description = "server for ai agents"
readme = "../README.md"
authors = [
    { name = "redsquirrelx", email = "redsquirrel.xi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.27.0",
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
dev = "server.cli:dev"
repomap = "server.cli:repomap"
depgraph = "server.cli:depgraph"
analyzer = "server.cli:analyzer"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "server"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
